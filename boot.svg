<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Sequência de inicialização do sistema Erick: status online" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12062a"/>
      <stop offset="1" stop-color="#26104a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 16px; fill: #e9d5ff; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .ok { fill: #86efac; }
    .dim { fill: #a78bfa; }
    .title { font-size: 13px; fill: #a78bfa; }
    .status { font-size: 18px; font-weight: 700; fill: #c084fc; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 2s ease-out 1.6s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; }
      .fill { transform: scaleX(1); animation: none; }
      .cursor, .dot { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="798" height="338" rx="12" fill="url(#bg)" stroke="#6b21a8" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h774a12 12 0 0 1 12 12v23H1z" fill="#1a0a36"/>
  <circle cx="26" cy="19" r="6" fill="#6b21a8"/>
  <circle cx="46" cy="19" r="6" fill="#9333ea"/>
  <circle cx="66" cy="19" r="6" fill="#c084fc"/>
  <text class="title" x="90" y="24">erick@system:~</text>

  <text class="l" x="28" y="70" style="animation-delay:0.3s">&gt; ERICK SYSTEM v1.0</text>
  <text class="l dim" x="28" y="98" style="animation-delay:1s">&gt; Initializing system...</text>

  <rect class="l" x="28" y="112" width="360" height="12" rx="6" fill="#1a0a36" stroke="#6b21a8" style="animation-delay:1.5s"/>
  <rect class="fill" x="28" y="112" width="360" height="12" rx="6" fill="url(#bar)"/>
  <text class="l" x="402" y="124" style="animation-delay:3.6s">100%</text>

  <text class="l" x="28" y="162" style="animation-delay:4s"><tspan class="ok">[OK]</tspan> Student detected</text>
  <text class="l" x="28" y="188" style="animation-delay:4.6s"><tspan class="ok">[OK]</tspan> Creativity enabled</text>
  <text class="l" x="28" y="214" style="animation-delay:5.2s"><tspan class="ok">[OK]</tspan> Web engine activated</text>
  <text class="l" x="28" y="240" style="animation-delay:5.8s"><tspan class="ok">[OK]</tspan> AI-900 module loaded</text>
  <text class="l" x="28" y="266" style="animation-delay:6.4s"><tspan class="ok">[OK]</tspan> Projects loaded</text>

  <g class="l" style="animation-delay:7.2s">
    <circle class="dot" cx="36" cy="306" r="6" fill="#86efac"/>
    <text class="status" x="52" y="312">STATUS: ONLINE</text>
    <rect class="cursor" x="232" y="296" width="10" height="20" fill="#c084fc"/>
